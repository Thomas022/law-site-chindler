name: Publicar no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v6
      - name: Instalar pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Validar configuração da API
        run: |
          test -n "$NEXT_PUBLIC_API_URL"
          curl --fail --show-error --silent --retry 5 --retry-delay 10 "$NEXT_PUBLIC_API_URL/health/"
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.API_URL }}
      - name: Gerar site estático
        run: pnpm build:pages
        env:
          NEXT_PUBLIC_BASE_PATH: /law-site-chindler
          NEXT_PUBLIC_API_URL: ${{ vars.API_URL }}
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enviar site gerado
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/client
          retention-days: 1
          include-hidden-files: true
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
