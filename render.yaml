databases:
  - name: chindler-database
    databaseName: chindler
    user: chindler
    plan: basic-256mb
    region: virginia

services:
  - type: web
    name: chindler-backend
    runtime: python
    plan: starter
    region: virginia
    rootDir: backend
    buildCommand: ./scripts/render-build.sh
    preDeployCommand: python manage.py migrate --settings=chindler_backend.settings.production
    startCommand: gunicorn chindler_backend.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health/
    autoDeploy: false
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: chindler_backend.settings.production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: chindler-database
          property: connectionString
      - key: DATABASE_SSL_REQUIRE
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        value: https://thomas022.github.io
      - key: CSRF_TRUSTED_ORIGINS
        value: https://thomas022.github.io
      - key: CLOUDINARY_URL
        sync: false
      - key: PRIVACY_POLICY_VERSION
        value: "1.0"
      - key: WEB_CONCURRENCY
        value: "2"

  - type: cron
    name: chindler-anonymize-expired-leads
    runtime: python
    plan: starter
    region: virginia
    rootDir: backend
    schedule: "0 3 * * *"
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python manage.py anonymize_expired_leads --settings=chindler_backend.settings.production
    autoDeploy: false
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: chindler_backend.settings.production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: localhost
      - key: DATABASE_URL
        fromDatabase:
          name: chindler-database
          property: connectionString
      - key: DATABASE_SSL_REQUIRE
        value: "true"
      - key: CLOUDINARY_URL
        sync: false
      - key: PRIVACY_POLICY_VERSION
        value: "1.0"
